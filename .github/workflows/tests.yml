name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3-stable
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}_linux.x86_64 godot && chmod +x godot
      - name: Import project
        run: ~/godot/godot --headless --path . --import || true
      - name: Validate data
        run: ~/godot/godot --headless --path . --script tests/validate_data.gd
      - name: Run tests
        run: ~/godot/godot --headless --path . --script tests/run_tests.gd
      - name: Balance snapshot
        run: ~/godot/godot --headless --path . --script tests/balance_harness.gd -- --runs 50
